<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceType UI Redesign Concept</title>
  <style>
    :root {
      --bg-0: #060806;
      --bg-1: #0d120e;
      --panel: #101712cc;
      --panel-border: #1e3125;
      --ink: #e7f6eb;
      --muted: #8fb29a;
      --green-1: #21d56f;
      --green-2: #16b95b;
      --green-3: #0f8e44;
      --danger: #ff6b6b;
      --glow: 0 0 0 1px #1e3125, 0 10px 40px rgba(33, 213, 111, 0.12);
      --r: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", "Noto Sans SC", "PingFang SC", sans-serif;
      background:
        radial-gradient(1000px 520px at 84% -10%, rgba(33, 213, 111, 0.20), transparent 60%),
        radial-gradient(800px 520px at -10% 90%, rgba(33, 213, 111, 0.12), transparent 70%),
        linear-gradient(155deg, var(--bg-0), var(--bg-1));
      overflow-x: hidden;
    }

    .ambient-heart {
      position: fixed;
      right: 7vw;
      top: 10vh;
      opacity: .08;
      font-size: clamp(120px, 18vw, 280px);
      filter: drop-shadow(0 0 20px rgba(33, 213, 111, 0.45));
      animation: pulse 3.6s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.96); opacity: .06; }
      50% { transform: scale(1.04); opacity: .1; }
    }

    .wrap {
      width: min(1100px, 92vw);
      margin: 40px auto 130px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: calc(var(--r) + 4px);
      box-shadow: var(--glow);
      backdrop-filter: blur(8px);
    }

    .main { padding: 22px; }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: .4px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .status-pill {
      border: 1px solid #234c34;
      color: #b7f7cf;
      background: rgba(22, 185, 91, 0.12);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      border: 1px solid #1d2a21;
      border-radius: var(--r);
      padding: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    }

    .card h3 {
      margin: 2px 0 10px;
      font-size: 15px;
      color: #cbf6d9;
      font-weight: 600;
    }

    .full { grid-column: 1 / -1; }

    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }

    input, select, textarea {
      width: 100%;
      border: 1px solid #294031;
      background: #0b120d;
      color: var(--ink);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
      transition: .2s ease;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--green-1);
      box-shadow: 0 0 0 3px rgba(33, 213, 111, .16);
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .chip {
      border: 1px solid #2a4c38;
      background: #102015;
      color: #bdeecd;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-family: inherit;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-ghost {
      color: #d7eee0;
      background: #1a2a20;
      border: 1px solid #2e4a38;
    }

    .btn-ghost:hover { transform: translateY(-1px); }

    .btn-main {
      color: #05210e;
      background: linear-gradient(180deg, #38f486, #20c464);
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(33, 213, 111, .35);
    }

    .btn-main:hover { transform: translateY(-1px) scale(1.01); }

    .side {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .side h2 {
      margin: 0;
      font-size: 17px;
      color: #d4f6df;
    }

    .preview-overlay {
      border: 1px solid #2b4e39;
      border-radius: 24px;
      background: rgba(4, 10, 6, .82);
      min-height: 88px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: var(--green-1);
      box-shadow: 0 0 0 7px rgba(33,213,111,.14);
      transition: .2s ease;
    }

    .wave {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 20px;
      opacity: 0;
      transform: scale(.9);
      transition: .2s ease;
    }

    .bar {
      width: 3px;
      border-radius: 4px;
      background: #68f8a2;
      animation: wave 1s ease-in-out infinite;
    }

    .bar:nth-child(1){height:8px;animation-delay:.0s}
    .bar:nth-child(2){height:16px;animation-delay:.12s}
    .bar:nth-child(3){height:11px;animation-delay:.2s}
    .bar:nth-child(4){height:15px;animation-delay:.1s}
    .bar:nth-child(5){height:9px;animation-delay:.24s}

    @keyframes wave { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }

    .preview-text { font-size: 14px; color: #d8f6e3; }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #243b2c;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      color: #a9d6b8;
    }

    .switch {
      appearance: none;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #26372e;
      position: relative;
      outline: none;
      cursor: pointer;
      transition: .2s ease;
    }

    .switch::after {
      content: "";
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #d9f7e5;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: .2s ease;
    }

    .switch:checked { background: #1a9f53; }
    .switch:checked::after { left: 23px; }

    @media (max-width: 920px) {
      .wrap { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="ambient-heart">❤</div>

  <main class="wrap">
    <section class="panel main">
      <div class="title">
        <div>
          <h1>VoiceType · 温柔黑绿版</h1>
          <div class="subtitle">按住说话，松开即落字。保留你原有结构，只升级视觉和氛围。</div>
        </div>
        <div class="status-pill">引擎就绪 · Paraformer</div>
      </div>

      <div class="grid">
        <article class="card">
          <h3>引擎选择</h3>
          <label>语音引擎</label>
          <select>
            <option>阿里云 Paraformer（云端）</option>
            <option>火山引擎 BigModel（云端）</option>
            <option>faster-whisper（本地）</option>
          </select>
        </article>

        <article class="card">
          <h3>快捷键</h3>
          <label>Push-to-Talk 热键</label>
          <input value="Ctrl + Alt + S" />
        </article>

        <article class="card full">
          <h3>API 配置</h3>
          <div class="row">
            <div>
              <label>DashScope API Key</label>
              <input type="password" value="sk-****************************" />
            </div>
            <div>
              <label>Phrase ID（热词表）</label>
              <input value="vt-88c13f..." />
            </div>
          </div>
        </article>

        <article class="card full">
          <h3>润色强度</h3>
          <div class="chip-row">
            <span class="chip">轻度</span>
            <span class="chip" style="border-color:#2dc06a;background:#12351f;color:#d6ffe4;">中度（推荐）</span>
            <span class="chip">重度</span>
          </div>
        </article>

        <article class="card full">
          <h3>自定义词库</h3>
          <div class="chip-row" style="margin-bottom:10px;">
            <span class="chip">CUDA</span><span class="chip">GitHub</span><span class="chip">ROS2</span><span class="chip">Paraformer</span>
          </div>
          <label>新增词汇</label>
          <input placeholder="输入专业词汇后点击添加" />
        </article>
      </div>

      <div class="btns">
        <button class="btn-ghost">取消</button>
        <button class="btn-main">保存并应用</button>
      </div>
    </section>

    <aside class="panel side">
      <h2>浮窗预览</h2>
      <div class="preview-overlay" id="overlay">
        <span class="dot" id="dot"></span>
        <span class="wave" id="wave">
          <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
        </span>
        <span class="preview-text" id="previewText">准备就绪，按住快捷键开始说话</span>
      </div>

      <label class="toggle">
        模拟录音中
        <input id="recordingSwitch" class="switch" type="checkbox" />
      </label>

      <div style="font-size:12px;color:#8fb29a;line-height:1.6;">
        设计意图：
        黑色保持专注，绿色传达“可用、安心、生长感”。
        用柔和光晕和心跳背景，把原本偏工具感的界面变得更有陪伴感。
      </div>
    </aside>
  </main>

  <script>
    const sw = document.getElementById('recordingSwitch');
    const dot = document.getElementById('dot');
    const wave = document.getElementById('wave');
    const txt = document.getElementById('previewText');

    sw.addEventListener('change', () => {
      if (sw.checked) {
        dot.style.background = '#ff5f6d';
        dot.style.boxShadow = '0 0 0 7px rgba(255,95,109,.16)';
        wave.style.opacity = '1';
        wave.style.transform = 'scale(1)';
        txt.textContent = '正在聆听中… 你说，我在。';
      } else {
        dot.style.background = '#21d56f';
        dot.style.boxShadow = '0 0 0 7px rgba(33,213,111,.14)';
        wave.style.opacity = '0';
        wave.style.transform = 'scale(.9)';
        txt.textContent = '准备就绪，按住快捷键开始说话';
      }
    });
  </script>
</body>
</html>
